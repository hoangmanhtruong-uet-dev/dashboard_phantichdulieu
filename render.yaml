services:
  - type: web
    name: nexus-staging-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: PUBLIC_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: nexus-staging-api
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: python -m data.migrate
    startCommand: uvicorn ai_service:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexus-staging-redis
          property: connectionString
      - key: QUEUE_NAME
        value: nexus-staging-jobs
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: nexus-staging-worker
    runtime: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m backend.worker
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexus-staging-redis
          property: connectionString
      - key: QUEUE_NAME
        value: nexus-staging-jobs
      - key: SEED_DEMO_DATA
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: CORS_ORIGINS
        value: https://worker.invalid
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: nexus-staging-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: cron
    name: nexus-staging-backup
    runtime: python
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m scripts.backup_postgres
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-staging-postgres
          property: connectionString
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_PREFIX
        value: staging/postgres
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: nexus-staging-postgres
    plan: basic-256mb
    databaseName: nexus_staging
    user: nexus_staging
    ipAllowList: []
